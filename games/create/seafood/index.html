<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日海產</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #12202c;
    color: #222;
    display: flex;
    justify-content: center;
    padding: 20px 12px;
  }
  #wrap { max-width: 680px; width: 100%; }
  h1 { color: #eaf4fb; font-size: 20px; text-align: center; margin: 0 0 16px; font-weight: 600; }
  .panel { background: #f4f7f5; border-radius: 14px; padding: 18px; }
  .section-title { font-size: 14px; color: #556; margin: 0 0 8px; font-weight: 600; }
  .grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
  .pick-card {
    cursor: pointer; border: 2px solid #dde3e0; border-radius: 12px;
    padding: 12px 6px; text-align: center; background: #fff;
    transition: border-color .15s, background .15s;
  }
  .pick-card.selected { border-color: #1c6ea8; background: #e7f2fa; }
  .pick-icon { font-size: 22px; display:block; margin-bottom: 6px; }
  .pick-name { font-size: 13px; font-weight: 600; color: #223; }
  .pick-desc { font-size: 11px; color: #778; margin-top: 2px; }
  button {
    font-family: inherit; cursor: pointer; border-radius: 10px; border: none;
    background: #1c6ea8; color: #fff; padding: 10px 16px; font-size: 15px; font-weight: 600;
  }
  button.secondary { background: #e2e8e5; color: #334; }
  button:disabled { opacity: .5; cursor: default; }
  button:active { opacity: .85; }
  #startBtn { width: 100%; height: 46px; }
  #gameScreen, #overScreen { display: none; }
  .hud { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:14px; color:#445; }
  .hud b { font-size: 18px; color:#112; margin-left:4px; }
  #canvasWrap { position:relative; width:100%; border-radius:12px; overflow:hidden; border:1px solid #d6dcd9; }
  canvas { width:100%; display:block; cursor:crosshair; touch-action:none; background:#bfe3f0; }
  .hint { text-align:center; font-size:13px; color:#889; margin:8px 0 0; }
  .score-box { background:#fff; border-radius:12px; padding:20px; text-align:center; margin-bottom:16px; }
  .score-box p { margin:0 0 4px; font-size:13px; color:#778; }
  .score-box b { font-size:32px; font-weight:700; color:#112; }
  .save-row { display:flex; gap:8px; margin-bottom:16px; }
  .save-row input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid #d6dcd9; font-size:14px; }
  #leaderList { border:1px solid #d6dcd9; border-radius:10px; overflow:hidden; margin-bottom:16px; background:#fff; }
  .lb-row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; font-size:14px; border-bottom:1px solid #edf1ef; }
  .lb-row:last-child { border-bottom:none; }
  .lb-rank { color:#99a; margin-right:10px; font-weight:600; }
  .lb-empty { padding:16px; font-size:13px; color:#99a; text-align:center; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:10px; font-size:11px; color:#667; }
  .legend span { display:flex; align-items:center; gap:4px; }
  .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }
</style>
</head>
<body>
<div id="wrap">
  <h1>今日海產</h1>
  <div class="panel">

    <div id="menuScreen">
      <p class="section-title">選擇角色</p>
      <div id="charGrid" class="grid3"></div>

      <p class="section-title">選擇難度</p>
      <div id="diffGrid" class="grid3"></div>

      <button id="startBtn" disabled>載入素材中...</button>
    </div>

    <div id="gameScreen">
      <div class="hud">
        <div>分數<b id="score">0</b></div>
        <div id="charLabel" style="font-size:13px; color:#667;"></div>
        <div>時間<b id="time">60</b></div>
      </div>
      <div id="canvasWrap">
        <canvas id="game" width="640" height="400"></canvas>
      </div>
      <p class="hint">滑鼠移動 / 手指拖曳瞄準，按住畫面(或空白鍵)蓄力，放開發射 — 蓄力越久射程越遠</p>
      <div class="legend">
        <span><i style="background:#EF9F27"></i>河豚 +15</span>
        <span><i style="background:#F4C542"></i>熱帶魚 +35</span>
        <span><i style="background:#8FB3C9"></i>其他魚 +15~25</span>
        <span><i style="background:#2F6FA8"></i>旗魚(稀有) +50</span>
        <span><i style="background:#AFC7EE"></i>水母 -20</span>
        <span><i style="background:#8B5E3C"></i>垃圾 -12~-15</span>
      </div>
    </div>

    <div id="overScreen">
      <div class="score-box">
        <p>遊戲結束</p>
        <b id="finalScore">0</b>
      </div>
      <div class="save-row">
        <input id="nameInput" type="text" placeholder="輸入你的名字" maxlength="12" value="玩家" />
        <button id="saveBtn">儲存分數</button>
      </div>
      <p class="section-title">排行榜</p>
      <div id="leaderList"></div>
      <button id="againBtn" class="secondary" style="width:100%; height:46px;">回到選單</button>
    </div>

  </div>
</div>

<script>
(function(){
  const CHARS = [
    {id:'quick', name:'迅速手', icon:'⚡', desc:'收竿速度 +60%'},
    {id:'sharp', name:'神射手', icon:'🎯', desc:'命中範圍加大'},
    {id:'captain', name:'老船長', icon:'⏱️', desc:'時間 +15 秒'}
  ];
  const DIFFS = [
    {id:'easy', name:'簡單', icon:'🙂', time:75, speedMult:0.7, junk:0.14, maxFish:6},
    {id:'normal', name:'普通', icon:'😐', time:60, speedMult:1.0, junk:0.20, maxFish:8},
    {id:'hard', name:'困難', icon:'🔥', time:45, speedMult:1.45, junk:0.30, maxFish:10}
  ];

  const state = { charId:'quick', diffId:'normal' };

  function cardHtml(item, kind){
    const isChar = kind === 'char';
    return '<div class="pick-card" data-kind="'+kind+'" data-id="'+item.id+'">'
      + '<span class="pick-icon">'+item.icon+'</span>'
      + '<div class="pick-name">'+item.name+'</div>'
      + '<div class="pick-desc">'+(isChar ? item.desc : item.time+' 秒')+'</div>'
      + '</div>';
  }

  const charGrid = document.getElementById('charGrid');
  const diffGrid = document.getElementById('diffGrid');
  charGrid.innerHTML = CHARS.map(c => cardHtml(c,'char')).join('');
  diffGrid.innerHTML = DIFFS.map(d => cardHtml(d,'diff')).join('');

  function refreshSelection(){
    charGrid.querySelectorAll('.pick-card').forEach(el => {
      el.classList.toggle('selected', el.dataset.id === state.charId);
    });
    diffGrid.querySelectorAll('.pick-card').forEach(el => {
      el.classList.toggle('selected', el.dataset.id === state.diffId);
    });
  }
  charGrid.addEventListener('click', e => {
    const card = e.target.closest('.pick-card');
    if(!card) return;
    state.charId = card.dataset.id;
    refreshSelection();
  });
  diffGrid.addEventListener('click', e => {
    const card = e.target.closest('.pick-card');
    if(!card) return;
    state.diffId = card.dataset.id;
    refreshSelection();
  });
  refreshSelection();

  const menuScreen = document.getElementById('menuScreen');
  const gameScreen = document.getElementById('gameScreen');
  const overScreen = document.getElementById('overScreen');
  const startBtn = document.getElementById('startBtn');

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 640, H = 400;
  const waterY = 225;

  const boatW = 115, boatH = 70;
  const boatX = W/2 - boatW*0.42, boatY = waterY - 46;
  const pivot = { x: boatX + boatW*0.60, y: boatY + boatH*0.30 };
  const maxLen = H - pivot.y - 15;
  const ropeMin = 10;
  const maxAngle = 1.3;

  const harpW = 66, harpH = 22;
  const harpAnchorFrac = 0.55; // fraction from left edge that sits at the hand pivot (held pose)

  const MIN_RANGE = 110;
  const CHARGE_MS = 900;

  let score = 0, timeLeft = 60, running = false;
  let angle = 0;
  let spearLen = ropeMin;
  let mode = 'idle';
  let fish = [];
  let lastTs = null, spawnTimer = 0, globalT = 0;
  let retractMult = 1, hitBonus = 0;
  let diffCfg = DIFFS[1];
  let timerInt = null;
  let aiming = false;
  let isCharging = false, chargeStart = 0;
  let shotRange = MIN_RANGE;

  // ---- load sprites ----
  const IMAGES = {};
  let loadedCount = 0;
  const spriteNames = Object.keys(SPRITE_SRC);
  spriteNames.forEach(name => {
    const img = new Image();
    img.onload = () => { loadedCount++; if(loadedCount === spriteNames.length){ startBtn.disabled = false; startBtn.textContent = '開始遊戲'; } };
    img.onerror = () => { loadedCount++; if(loadedCount === spriteNames.length){ startBtn.disabled = false; startBtn.textContent = '開始遊戲'; } };
    img.src = SPRITE_SRC[name];
    IMAGES[name] = img;
  });

  // kind config: draw size (w,h), collision radius, points, speed range, default facing (true = sprite's own art faces right)
  const KIND_CFG = {
    baitfish:  { sprite:'baitfish',  w:34, h:18, r:11, points:15,  spd:[0.9,1.7], faceRight:false },
    angelfish: { sprite:'angelfish', w:46, h:39, r:17, points:35,  spd:[1.0,1.8], faceRight:false },
    puffer:    { sprite:'puffer',    w:46, h:36, r:19, points:15,  spd:[0.3,0.6], faceRight:false },
    sardine:   { sprite:'sardine',   w:66, h:16, r:16, points:20,  spd:[1.3,2.2], faceRight:false },
    bass:      { sprite:'bass',      w:46, h:24, r:17, points:25,  spd:[0.6,1.1], faceRight:false },
    marlin:    { sprite:'marlin',    w:70, h:27, r:15, points:50,  spd:[1.7,2.6], faceRight:false },
    jelly:     { sprite:'jelly',     w:34, h:36, r:15, points:-20, spd:[0.2,0.45], faceRight:true },
    boot:      { sprite:'boot',      w:34, h:29, r:14, points:-15, spd:[0.25,0.5], faceRight:true },
    can:       { sprite:'can',       w:24, h:29, r:12, points:-12, spd:[0.25,0.5], faceRight:true }
  };

  function rand(a,b){ return a + Math.random()*(b-a); }

  function pickKind(){
    const j = diffCfg.junk;
    const fishPool = 1 - j;
    const weights = [
      ['boot', j*0.35],
      ['can', j*0.35],
      ['jelly', j*0.30],
      ['marlin', fishPool*0.05],
      ['puffer', fishPool*0.14],
      ['sardine', fishPool*0.16],
      ['bass', fishPool*0.16],
      ['angelfish', fishPool*0.18],
      ['baitfish', fishPool*0.31]
    ];
    let r = Math.random();
    for(const [k,w] of weights){
      if(r < w) return k;
      r -= w;
    }
    return 'baitfish';
  }

  function spawnFish(){
    const kind = pickKind();
    const cfg = KIND_CFG[kind];
    const depth = rand(waterY+28, H-22);
    const dir = Math.random() < 0.5 ? 1 : -1;
    const speed = rand(cfg.spd[0], cfg.spd[1]) * diffCfg.speedMult;
    fish.push({ kind, cfg, x: dir===1?-40:W+40, y:depth, dir, speed, alive:true, phase:rand(0,Math.PI*2), rot:0 });
  }

  function initFishField(){
    fish = [];
    for(let i=0;i<5;i++){ spawnFish(); fish[i].x = rand(30,W-30); }
  }

  function drawBackground(t){
    ctx.drawImage(IMAGES.bg, 0, 0, W, H);

    ctx.beginPath();
    ctx.moveTo(0, waterY);
    for(let x=0;x<=W;x+=20){
      const y = waterY + Math.sin(x*0.05 + t*0.002)*3;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
    const seaGrad = ctx.createLinearGradient(0,waterY,0,H);
    seaGrad.addColorStop(0, 'rgba(63,159,214,0.55)');
    seaGrad.addColorStop(1, 'rgba(15,76,120,0.75)');
    ctx.fillStyle = seaGrad;
    ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      const yy = waterY + 30 + i*45;
      for(let x=0;x<=W;x+=16){
        const y = yy + Math.sin(x*0.04 + t*0.0015 + i)*4;
        x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }

  function drawBoat(t){
    const bob = Math.sin(t*0.0025)*2;
    ctx.drawImage(IMAGES.boat, boatX, boatY+bob, boatW, boatH);
    return bob;
  }

  function aimRotation(){
    const dx = Math.sin(angle), dy = Math.cos(angle);
    return Math.atan2(dy,dx) - Math.PI;
  }

  function drawHarpoonHeld(bob){
    if(mode !== 'idle') return;
    const r = aimRotation();
    ctx.save();
    ctx.translate(pivot.x, pivot.y + bob);
    ctx.rotate(r);
    ctx.drawImage(IMAGES.harpoon, -harpW*harpAnchorFrac, -harpH/2, harpW, harpH);
    ctx.restore();
  }

  function spearTipPos(){
    const x = pivot.x + Math.sin(angle) * spearLen;
    const y = pivot.y + Math.cos(angle) * spearLen;
    return {x,y};
  }

  function currentPreviewLen(){
    if(isCharging){
      const elapsed = performance.now() - chargeStart;
      const frac = Math.min(1, elapsed/CHARGE_MS);
      return MIN_RANGE + (maxLen-MIN_RANGE)*frac;
    }
    return Math.min(maxLen, 170);
  }

  function drawAimGuide(){
    if(mode !== 'idle') return;
    const previewLen = currentPreviewLen();
    const ex = pivot.x + Math.sin(angle) * previewLen;
    const ey = pivot.y + Math.cos(angle) * previewLen;
    ctx.save();
    ctx.setLineDash([6,7]);
    ctx.strokeStyle = isCharging ? 'rgba(255,210,90,0.9)' : 'rgba(255,255,255,0.75)';
    ctx.lineWidth = isCharging ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(pivot.x, pivot.y);
    ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = isCharging ? 'rgba(255,210,90,0.95)' : 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(ex, ey, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawFlyingHarpoon(){
    if(mode === 'idle') return;
    const tip = spearTipPos();
    const r = aimRotation();
    ctx.strokeStyle = '#4a4842';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(pivot.x, pivot.y);
    ctx.lineTo(tip.x, tip.y);
    ctx.stroke();

    ctx.save();
    ctx.translate(tip.x, tip.y);
    ctx.rotate(r);
    ctx.drawImage(IMAGES.harpoon, 0, -harpH/2, harpW, harpH);
    ctx.restore();
  }

  function drawCreature(f){
    const cfg = f.cfg;
    const img = IMAGES[cfg.sprite];
    ctx.save();
    ctx.translate(f.x, f.y);
    if(f.kind === 'boot' || f.kind === 'can'){
      ctx.rotate(f.rot);
    } else if(f.kind === 'jelly'){
      // no flip needed
    } else {
      const shouldFlip = (f.dir === 1) !== cfg.faceRight;
      if(shouldFlip) ctx.scale(-1,1);
    }
    ctx.drawImage(img, -cfg.w/2, -cfg.h/2, cfg.w, cfg.h);
    ctx.restore();
  }

  function updateScoreUI(){ document.getElementById('score').textContent = score; }

  function endGame(){
    running = false;
    clearInterval(timerInt);
    document.getElementById('finalScore').textContent = score;
    gameScreen.style.display = 'none';
    overScreen.style.display = 'block';
    renderLeaderboard(loadLeaderboard());
  }

  function update(dt,t){
    if(!running) return;
    if(mode === 'shooting'){
      spearLen += 1.35 * dt;
      const tip = spearTipPos();
      for(const f of fish){
        if(!f.alive) continue;
        const ddx = tip.x-f.x, ddy = tip.y-f.y;
        if(Math.sqrt(ddx*ddx+ddy*ddy) < f.cfg.r + 6 + hitBonus){
          f.alive = false;
          score += f.cfg.points;
          if(score < 0) score = 0;
          updateScoreUI();
          mode = 'returning';
          break;
        }
      }
      if(spearLen >= shotRange) mode = 'returning';
    } else if(mode === 'returning'){
      spearLen -= 1.7 * retractMult * dt;
      if(spearLen <= ropeMin){ spearLen = ropeMin; mode = 'idle'; }
    }

    for(const f of fish){
      if(f.alive){
        f.x += f.dir * f.speed * dt * 0.06;
        if(f.kind === 'jelly') f.y += Math.sin(t*0.002+f.phase)*0.15;
        if(f.kind === 'boot' || f.kind === 'can') f.rot += 0.0006*dt*f.dir;
      } else {
        f.y -= 1.2*dt;
      }
    }
    fish = fish.filter(f => f.alive || f.y > -30);
    fish = fish.filter(f => f.x > -70 && f.x < W+70);

    spawnTimer -= dt;
    if(spawnTimer <= 0 && fish.filter(f=>f.alive).length < diffCfg.maxFish){
      spawnFish();
      spawnTimer = rand(280,650);
    }
  }

  function render(t){
    drawBackground(t);
    for(const f of fish) if(f.alive || f.y > -30) drawCreature(f);
    const bob = drawBoat(t);
    drawHarpoonHeld(bob);
    drawAimGuide();
    drawFlyingHarpoon();
  }

  function loop(ts){
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(ts-lastTs,50);
    lastTs = ts;
    globalT += dt;
    update(dt, globalT);
    render(globalT);
    if(running) requestAnimationFrame(loop);
  }

  function setAimFromPoint(px, py){
    const dx = px - pivot.x;
    const dy = Math.max(py - pivot.y, 12);
    let a = Math.atan2(dx, dy);
    if(a > maxAngle) a = maxAngle;
    if(a < -maxAngle) a = -maxAngle;
    angle = a;
  }

  function canvasPointFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width, scaleY = H / rect.height;
    const cx = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX) - rect.left;
    const cy = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY) - rect.top;
    return { x: cx*scaleX, y: cy*scaleY };
  }

  function startCharge(){
    if(mode !== 'idle' || !running || isCharging) return;
    isCharging = true;
    chargeStart = performance.now();
  }
  function releaseCharge(){
    if(!isCharging) return;
    isCharging = false;
    const elapsed = performance.now() - chargeStart;
    const frac = Math.min(1, elapsed/CHARGE_MS);
    shotRange = MIN_RANGE + (maxLen-MIN_RANGE)*frac;
    mode = 'shooting';
  }

  canvas.addEventListener('mousemove', e => {
    if(!running || mode !== 'idle') return;
    const p = canvasPointFromEvent(e);
    setAimFromPoint(p.x, p.y);
  });
  canvas.addEventListener('mousedown', e => {
    if(!running) return;
    const p = canvasPointFromEvent(e);
    setAimFromPoint(p.x, p.y);
    startCharge();
  });
  window.addEventListener('mouseup', () => { releaseCharge(); });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if(!running || mode !== 'idle') return;
    aiming = true;
    const p = canvasPointFromEvent(e);
    setAimFromPoint(p.x, p.y);
    startCharge();
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if(!running || !aiming) return;
    const p = canvasPointFromEvent(e);
    setAimFromPoint(p.x, p.y);
  }, {passive:false});
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    aiming = false;
    releaseCharge();
  }, {passive:false});

  window.addEventListener('keydown', e => {
    if(!running) return;
    if(e.code === 'Space'){ e.preventDefault(); if(!e.repeat) startCharge(); }
    if(e.code === 'ArrowLeft' && mode === 'idle'){ angle = Math.max(-maxAngle, angle-0.06); }
    if(e.code === 'ArrowRight' && mode === 'idle'){ angle = Math.min(maxAngle, angle+0.06); }
  });
  window.addEventListener('keyup', e => {
    if(e.code === 'Space'){ e.preventDefault(); releaseCharge(); }
  });

  function startGame(){
    diffCfg = DIFFS.find(d => d.id === state.diffId);
    const char = CHARS.find(c => c.id === state.charId);
    retractMult = char.id === 'quick' ? 1.6 : 1;
    hitBonus = char.id === 'sharp' ? 10 : 0;
    timeLeft = diffCfg.time + (char.id === 'captain' ? 15 : 0);
    score = 0; angle = 0; spearLen = ropeMin; mode = 'idle';
    isCharging = false; shotRange = MIN_RANGE;
    lastTs = null; globalT = 0; spawnTimer = 0;
    initFishField();
    updateScoreUI();
    document.getElementById('time').textContent = timeLeft;
    document.getElementById('charLabel').textContent = char.name;

    menuScreen.style.display = 'none';
    overScreen.style.display = 'none';
    gameScreen.style.display = 'block';
    running = true;
    clearInterval(timerInt);
    timerInt = setInterval(() => {
      if(!running) return;
      timeLeft -= 1;
      document.getElementById('time').textContent = Math.max(timeLeft,0);
      if(timeLeft <= 0) endGame();
    }, 1000);
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', () => {
    overScreen.style.display = 'none';
    menuScreen.style.display = 'block';
  });

  function loadLeaderboard(){
    try {
      const raw = localStorage.getItem('spearfishing_leaderboard');
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }
  function saveLeaderboard(entries){
    try { localStorage.setItem('spearfishing_leaderboard', JSON.stringify(entries)); } catch(e) {}
  }
  function renderLeaderboard(entries){
    const listEl = document.getElementById('leaderList');
    if(!entries.length){
      listEl.innerHTML = '<div class="lb-empty">還沒有紀錄，儲存你的分數看看吧。</div>';
      return;
    }
    listEl.innerHTML = entries.slice(0,10).map((e,i) => (
      '<div class="lb-row"><span><span class="lb-rank">'+(i+1)+'</span>'+escapeHtml(e.name)+'</span><span><b>'+e.score+'</b></span></div>'
    )).join('');
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    const name = document.getElementById('nameInput').value.trim() || '玩家';
    const entries = loadLeaderboard();
    entries.push({ name, score, ts: Date.now() });
    entries.sort((a,b) => b.score - a.score);
    const top = entries.slice(0,10);
    saveLeaderboard(top);
    renderLeaderboard(top);
  });
})();
</script>

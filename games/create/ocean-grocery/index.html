button{font:inherit;color:inherit;cursor:pointer}

#stagewrap{border:4px solid var(--line);border-radius:8px;background:#bfe6f7;box-shadow:0 5px 0 var(--line);overflow:hidden;line-height:0;display:flex;justify-content:center}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#say{margin-top:12px;padding:10px 14px 12px 76px;min-height:92px;position:relative}
#say .face{position:absolute;left:10px;top:10px;width:56px;height:56px;background:var(--sand);border:3px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center}
#say .nm{font-size:15px;color:var(--coral2);margin-bottom:2px}#say .tx{font-size:18px}
#panel{padding:14px 14px 16px}

.tip{margin:0 0 10px;font-size:15px;color:#7a6a63;background:#fff1cf;border:2px dashed #e2b23c;border-radius:6px;padding:6px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.b{min-height:46px;padding:6px 16px;border:3px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 4px 0 var(--line);font-size:18px;transition:transform .05s}
.b:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.b:disabled{opacity:.45;box-shadow:0 4px 0 #9a8d86;cursor:not-allowed}

.cell:active{transform:translateY(3px);box-shadow:none}
.cell.sp::after{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:#fff;box-shadow:0 -6px 0 #fff,0 6px 0 #fff,-6px 0 0 #fff,6px 0 0 #fff;animation:tw 1.4s steps(2) infinite}
.cell.sp:nth-child(3n)::after{animation-delay:.5s}.cell.sp:nth-child(4n)::after{animation-delay:.9s}

.cell.dug{background:#d9b377;box-shadow:inset 0 3px 0 #b88a4a;border-style:dashed;animation:pop .25s}

.d1{filter:sepia(.35) brightness(.93)}.d2{filter:sepia(.75) brightness(.78) saturate(.8)}
.det{margin-top:12px;padding:10px;display:flex;gap:10px;flex-wrap:wrap}.det .big{flex:0 0 72px;text-align:center}.det .inf{flex:1 1 180px;font-size:15px}.det .inf b{font-size:18px;color:var(--coral2)}.det .inf p{margin:2px 0}
.wig{animation:wig .3s}@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.sc{display:inline-flex;gap:3px}.sc i{width:12px;height:12px;border:2px solid var(--line);background:#fff;border-radius:3px}.sc i.f{background:var(--sea)}
.hearts{display:flex;gap:3px;align-items:center}
.price{text-align:center;margin:8px 0}.price .n{font-size:40px;color:var(--coral2);line-height:1.1}
input[type=range]{width:100%;height:36px;accent-color:var(--coral)}
.kv{display:flex;justify-content:space-between;border-bottom:2px dotted #d9c9a8;padding:3px 0}
.deco{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:2px dotted #d9c9a8}
.deco small{display:block;color:#8a7a72;font-size:13px}
.wx-sun{background:#fff1b3}.wx-cloud{background:#e3e8ee}.wx-rain{background:#cfe3f5}.wx-storm{background:#cfc9e3}
.steps span{font-size:13px;padding:3px 0}
#modal[hidden]{display:none}#modal{position:fixed;inset:0;background:rgba(60,40,70,.55);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px;z-index:9}
#modal .mb{max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.dex .card{min-height:104px}.dex .q{filter:brightness(0) opacity(.25)}
.title{text-align:center;padding:8px 4px}.title h1{margin:4px 0;font-size:40px;color:var(--coral2);text-shadow:3px 3px 0 #fff,5px 5px 0 var(--sun)}.title p{margin:6px 0}

.combo{display:inline-block;background:var(--coral);color:#fff;border:2px solid var(--line);border-radius:6px;padding:0 8px;font-size:14px}

 sfx(n){const T=(...a)=>this.tone(...a);({click:()=>T(620,.06,'square',.04),pop:()=>T(300,.12,'triangle',.08,0,120),find:()=>[660,880,1175].forEach((f,i)=>T(f,.14,'square',.04,i*.07)),
  scrub:()=>T(200+Math.random()*120,.07,'sawtooth',.03),clean:()=>[880,1320].forEach((f,i)=>T(f,.12,'triangle',.06,i*.08)),coin:()=>{T(988,.08,'square',.04);T(1319,.18,'square',.04,.08)},
  good:()=>[523,659,784,1047].forEach((f,i)=>T(f,.18,'triangle',.07,i*.09)),no:()=>T(240,.22,'sawtooth',.04,0,150),step:()=>T(420,.05,'triangle',.04),bell:()=>[1047,1568].forEach((f,i)=>T(f,.5,'sine',.05,i*.12)),
  lamp:()=>[392,523,659,784,1047,1319].forEach((f,i)=>T(f,.5,'triangle',.07,i*.14))}[n]||(()=>{}))()},
 waves(){const c=this.ctx,len=c.sampleRate*3,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=l*.97+(Math.random()*2-1)*.03;d[i]=l*6}
  const s=c.createBufferSource();s.buffer=b;s.loop=true;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=c.createGain();g.gain.value=.05;const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.11;lg.gain.value=.035;lfo.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(this.master);s.start();lfo.start()},

};

 if(ck.ph==='pick'){const F=fishOf();h+=F.length?`<div class="cards" style="margin-top:8px">${F.map(i=>card(i,'cfish')).join('')}</div>`:'<div class="empty">背包裡沒有魚…</div>';
  return h+`<div class="row">${btn('cbuy','去市場買沙丁魚 6','sun','',G.money<6)}${btn('cskip','這份先不做','')}</div>`}
 if(ck.ph==='cook'){const half=ck.d==='soup'?18:ck.d==='grill'?14:16;return h+`<p class="tip">看準時機，在游標跑到綠色區域時按「現在！」，正中間最完美！</p><div style="position:relative;height:34px;border:3px solid var(--line);background:#fff;border-radius:6px;overflow:hidden;margin:10px 0"><div style="position:absolute;left:${50-half}%;width:${half*2}%;top:0;bottom:0;background:var(--mint)"></div><div style="position:absolute;left:45%;width:10%;top:0;bottom:0;background:var(--sun)"></div><div id="cur" style="position:absolute;left:0;top:-2px;bottom:-2px;width:8px;background:var(--coral2);border:2px solid var(--line)"></div></div><div class="row" style="justify-content:center">${btn('stop','現在！','go big')}</div>`}
 return h+`<div class="det box"><div class="big">${spr(Ds.s,64)}</div><div class="inf"><b>${Ds.n}</b><p>${ck.msg}</p><p>收入：<b>${ck.pay}</b> 貝幣</p></div></div><div class="row">${btn('cnext',ck.n+1>=ck.tot?'收工':'下一位','go big')}</div>`};
ACT.cbuy=()=>{if(G.money<6)return;G.money-=6;addItem(makeItem('sardine'));Aud.sfx('coin');render()};
ACT.cskip=()=>{U.ck.n++;Scene.leave();setTimeout(ckNext,350)};
ACT.cfish=d=>{const ck=U.ck;ck.fish=+d.u;ck.ph='cook';ck.pos=0;ck.dir=1;Aud.sfx('click');render();const sp=ck.d==='soup'?85:ck.d==='grill'?125:105;TM=setInterval(()=>{ck.pos+=ck.dir*sp*.03;if(ck.pos>=100){ck.pos=100;ck.dir=-1}if(ck.pos<=0){ck.pos=0;ck.dir=1}const e=$('#cur');if(e)e.style.left=`calc(${ck.pos}% - ${ck.pos*.08}px)`},30)};
ACT.stop=()=>{const ck=U.ck;if(ck.ph!=='cook')return;stopTm();const it=G.items.find(i=>i.uid===ck.fish);if(!it){ckNext();return}const half=ck.d==='soup'?18:ck.d==='grill'?14:16,dist=Math.abs(ck.pos-50);
 const q=dist<=5?1.4:dist<=half?1.1:.6;const pay=Math.round((DISHES[ck.d].b+ITEMS[it.id].v*.6)*q*WXDISH[G.wx]);G.items=G.items.filter(i=>i!==it);ck.pay=pay;ck.earn+=pay;earnJob(pay);
 ck.msg=q>=1.4?'完美！香噴噴！':q>=1.1?'煮得不錯！':'有點焦了…下次小心。';ck.ph='show';Aud.sfx(q>1?'good':'no');Scene.burst(q>1?'heart':'drop',5);say(CUST[ck.c].n,q>1?'好好吃！':'嗯…還可以。',ck.c);saveG();render()};
ACT.cnext=()=>{U.ck.n++;Scene.leave();Aud.sfx('step');setTimeout(ckNext,450)};
/* --- 週末釣魚 --- */
R_.fish=()=>{const fs=U.fs||(U.fs={ph:'pick'});let h=`<h2>週末釣魚</h2><div class="kv"><span>剩餘拋竿次數</span><span>${G.casts}</span></div>`;
 if(fs.ph==='pick'){h+=`<p class="tip">選釣點、拋竿。浮標下沉時馬上拉竿！魚上鉤後，按住「拉」讓綠色區域追著魚跑。${fs.msg?`<br><b>${fs.msg}</b>`:''}</p>`+SPOTS.map(sp=>`<div class="deco"><span>${sp.n}<small>${G.un.rod>=sp.lv?`海之主：${G.boss.includes(sp.boss)?'已釣到！':'傳說在'+WXN[sp.bw]+'出現'}`:'魚竿 Lv'+sp.lv+' 才能來這裡'}</small></span>${btn('cast','拋竿','sea',`data-s="${sp.id}"`,G.un.rod<sp.lv||G.casts<=0)}</div>`).join('')+`<div class="row">${btn('fdone','收竿，去整理','go')}</div>`}
 else if(fs.ph==='wait')h+=`<div class="empty">浮標靜靜漂著…<br>等魚來</div>`;
 else if(fs.ph==='bite')h+=`<div class="empty" style="color:var(--coral2);font-size:24px">！有魚上鉤了！</div><div class="row" style="justify-content:center">${btn('pull','拉竿！','go big')}</div>`;
 else if(fs.ph==='reel')h+=`<p class="tip">${ITEMS[fs.fish].boss?'是海之主！':'上鉤了！'}按住「拉」，讓綠色區域包住魚。</p><div style="position:relative;height:40px;border:3px solid var(--line);background:#cfeefb;border-radius:6px;overflow:hidden;margin:10px 0"><div id="zone" style="position:absolute;top:0;bottom:0;background:rgba(127,214,164,.85);border-left:3px solid var(--mint2);border-right:3px solid var(--mint2)"></div><div id="fsh" style="position:absolute;top:4px;width:30px;height:30px;margin-left:-15px">${spr(fs.fish,30)}</div></div><div class="sc" style="display:block;height:16px;border:3px solid var(--line);background:#fff;border-radius:6px;overflow:hidden"><i id="fp" style="display:block;height:100%;width:35%;background:var(--coral);border:0;border-radius:0"></i></div><div class="row" style="justify-content:center"><button class="b sea big" id="hold" style="touch-action:none;user-select:none;min-width:200px">按住：拉！</button></div>`;
 else h+=`<div class="det box"><div class="big">${fs.ok?spr(fs.fish,64):''}</div><div class="inf"><b>${fs.ok?'釣到了！':'魚跑掉了…'}</b><p>${fs.txt}</p></div></div><div class="row">${btn('fcont','繼續','go big')}</div>`;
 return h};
ACT.cast=d=>{if(G.casts<=0)return;const sp=SPOTS.find(x=>x.id===d.s);G.casts--;U.fs={ph:'wait',sp};Scene.bob={x:106+Math.random()*14,dip:false,reel:false};Aud.sfx('pop');say('小店長','拋竿！等魚上鉤…','me');render();stopTm();TM=setTimeout(()=>{if(!U.fs||U.fs.ph!=='wait')return;U.fs.ph='bite';Scene.bob.dip=true;Aud.sfx('find');say('小店長','浮標沉下去了！快拉竿！','me');render();TM=setTimeout(()=>{if(U.fs&&U.fs.ph==='bite'){Scene.bob=null;U.fs={ph:'pick',msg:'太慢了，魚跑掉了…'};render()}},1400)},1400+Math.random()*2400)};
function pickFish(sp){if(!G.boss.includes(sp.boss)&&G.wx===sp.bw&&Math.random()<.22)return sp.boss;const t=sp.f.reduce((a,x)=>a+x[1],0);let r=Math.random()*t;for(const[f,w]of sp.f){if((r-=w)<=0)return f}return sp.f[0][0]}
ACT.pull=()=>{const fs=U.fs;if(fs.ph!=='bite')return;stopTm();fs.fish=pickFish(fs.sp);fs.ph='reel';fs.zp=50;fs.zv=0;fs.fp=50;fs.ft=50;fs.pr=35;fs.hold=false;fs.t=0;fs.nt=0;Scene.bob.dip=false;Scene.bob.reel=true;Aud.sfx('pop');say('小店長',ITEMS[fs.fish].boss?'好大的力氣…是傳說中的海之主！':'好重！加油！','me');render();
 const [z,sp]=FD[fs.fish];TM=setInterval(()=>{const dt=.03;fs.t+=dt;fs.zv+=(fs.hold?150:-120)*dt;fs.zv*=.92;fs.zp+=fs.zv*dt;const h=z/2;if(fs.zp<h){fs.zp=h;fs.zv=0}if(fs.zp>100-h){fs.zp=100-h;fs.zv=0}
  fs.nt-=dt;if(fs.nt<=0){fs.nt=.6+Math.random()*.9;fs.ft=8+Math.random()*84}fs.fp+=(fs.ft-fs.fp)*Math.min(1,dt*sp*2.2);
  const inz=Math.abs(fs.fp-fs.zp)<=h;fs.pr+=(inz?26:-15)*dt;const e=$('#zone');if(e){e.style.left=(fs.zp-h)+'%';e.style.width=z+'%';$('#fsh').style.left=fs.fp+'%';$('#fp').style.width=Math.max(0,Math.min(100,fs.pr))+'%'}
  if(fs.pr>=100)fEnd(true);else if(fs.pr<=0||fs.t>32)fEnd(false)},30)};
function fEnd(ok){stopTm();const fs=U.fs;Scene.bob=null;fs.ph='res';fs.ok=ok;if(ok){const it=addItem(makeItem(fs.fish));const I=ITEMS[fs.fish];Scene.pop={id:fs.fish,t:0};if(I.boss&&!G.boss.includes(fs.sp.boss)){G.boss.push(fs.sp.boss)}fs.txt=`${I.n}！${I.d}`+(I.boss?` （海之主 ${G.boss.length}/3）`:'');Aud.sfx(I.boss?'lamp':'good');say('小店長',I.boss?'釣到海之主了！太厲害了！':`釣到了${I.n}！`,'me');Scene.burst('star',8,80,40)}
 else{fs.txt='魚掙脫了，下次再試試。';Aud.sfx('no');say('小店長','可惜，魚跑掉了…','me')}saveG();render()}
ACT.fcont=()=>{if(G.casts<=0){ACT.fdone();return}U.fs={ph:'pick'};render()};
ACT.fdone=()=>{stopTm();Scene.bob=null;U.fs=null;G.stage='prep';Aud.sfx('step');say('小店長','釣到的魚可以賣，也可以拿去小食堂做料理。先整理貨品吧。','me');saveG();render()};
document.addEventListener('pointerdown',e=>{if(e.target.closest('#hold')&&U.fs)U.fs.hold=true});
['pointerup','pointercancel'].forEach(k=>document.addEventListener(k,()=>{if(U.fs)U.fs.hold=false}));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&U.fs&&U.fs.ph==='reel'){U.fs.hold=true;e.preventDefault()}});document.addEventListener('keyup',e=>{if(e.code==='Space'&&U.fs)U.fs.hold=false});
/* ===== 啟動 ===== */
function fit(){const p=$('#stagewrap').parentElement,av=p.clientWidth-8;let s=av/160;const f=Math.floor(s);if(f>=3&&s-f<.3)s=f;const cv=$('#cv');cv.style.width=Math.floor(160*s)+'px';cv.style.height=Math.floor(90*s)+'px'}
document.addEventListener('click',e=>{Aud.init();const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f)f(el.dataset,el)});
document.addEventListener('input',e=>{if(e.target.id==='pr'){U.price=+e.target.value;$('#pv').textContent=U.price}});
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(document.body);
Scene.init();const ctx=$('#cv').getContext('2d');ctx.imageSmoothingEnabled=false;
let last=performance.now();(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;drawScene(ctx,dt);requestAnimationFrame(loop)})(last);
say('外婆的小舖','歡迎來到海邊！','shell');render();fit();
</script></body></html>
